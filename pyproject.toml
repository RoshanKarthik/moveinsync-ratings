[project]
name = "moveinsync-ratings"
version = "0.1.0"
description = "Why the MoveInSync app is rated the way it is, refreshed on demand."
readme = "README.md"
authors = [
    { name = "Roshan Karthik", email = "roshankarrthik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-play-scraper>=1.2.7",
    "jinja2>=3.1.6",
    "openai>=3.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
ratings = "moveinsync_ratings:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
extend-exclude = [".uv-python", ".uv-cache", "scratch", "reports", "data"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google_play_scraper.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
