- id: OPS-05
  title: Account reviews with named employers — calls disabled, cut-offs, forced logout
  horizon: next
  track: ops
  type: Task
  priority: Medium
  owner: Account management + employer transport desks
  effort: S · one meeting per employer
  issues: [cannot_contact_driver, booking_rules]
  baseline: {share: 0.0097, k: 2, n: 207, days: 90, as_of: '2026-10-09'}
  evidence: orgs
  problem: >-
    Some complaints come from employer settings — calls to drivers disabled "as per company
    policy", strict booking cut-offs, frequent re-login — which are invisible from outside.
  change:
  - Share the monitor's employer table with account managers; review the settings behind the
    complaints with each named employer and agree changes or in-app explanations.
  - Where a rule stays, explain it in the app at the moment it applies (for example "Calls are
