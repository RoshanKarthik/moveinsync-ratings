  acceptance:
  - Each employer named three or more times has had a settings review.
  metric: Policy share of 1–2★ reviews; employer-level complaint counts (monitor).
  confirm_with: Employer configuration records.
  expected: Lowers policy-driven complaints that the app team cannot fix alone.

# ── Reply playbook (Google Play: address the comment, be respectful, never solicit ratings) ──
replies:
- issues: [crash_or_wont_open, slow_or_hangs, play_integrity_error]
  route: Mobile engineering (attach app version and device from the review)
  template: >-
    Sorry the app {crashed / would not open / was slow} for you, especially with your cab on
    the way. Our engineers are working on this. Please update to the latest version; if it still
    happens, write to app@moveinsync.com with your phone model so we can check it directly.
  after_fix: >-
    An update that fixes this problem is now on Google Play (version {x}). Thank you for reporting it.
- issues: [otp_not_received, forced_logout, registration_help]
  route: Platform / backend (OTP) · Product (sessions)
  template: >-
    Sorry you could not sign in. If the OTP does not arrive within a minute, please use
    the resend option; if it still does not arrive, write to app@moveinsync.com from your work email
    with your mobile operator, and we will check delivery for your number.
  after_fix: >-
    We have added a second way to receive the OTP and you will be asked to sign in less often in
    version {x}. Thank you for telling us.
- issues: [ui_redesign, checkin_friction, popups_permissions, forced_trip_rating]
  route: Product & design
  template: >-
    Thank you for the detailed feedback on {the new design / the seat-belt step / the pop-ups}. We
    have shared it with our design team and are changing {specific step} so it takes fewer taps.
- issues: [helpdesk_support, cab_late_or_missing, driver_behaviour, vehicle_condition, no_show_dispute]
  route: Operations & helpdesk (include employer if named)
  template: >-
    We are sorry about {the late cab / the driver / the no-show}. This should not happen. Please
    raise it in the app under Help with the trip date, or write to app@moveinsync.com from your work
    email, so the transport team for your company can look into this trip.
- issues: [routing_clubbing, pickup_time_changes, booking_rules, cannot_contact_driver]
  route: Routing team / account team (often an employer setting)
  template: >-
    Thank you for raising this. {Route length / booking cut-off / calling the driver} is set
    together with your company's transport team. We have passed your feedback to them; you can also
    raise it with your transport desk directly.
- issues: [safety_concern]
  route: Safety & compliance — same day
  template: >-
    We are very sorry to read this. Your safety is our priority and we would like to follow up
    personally. Please write to app@moveinsync.com with the trip date so our safety team can act on it today.
- issues: [tracking_inaccurate, eta_inaccurate, notifications, schedule_not_visible, booking_fails]
  route: Platform / backend
  template: >-
    Sorry the {cab location / arrival time / notification / booking} was wrong. We are working on
    {more accurate tracking / reliable notifications / clearer bookings}. If it happens again,
    please send the trip date to app@moveinsync.com so we can trace it.
