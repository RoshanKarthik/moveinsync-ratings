- id: OPS-04
  title: Review routing rules — long routes and clubbing
  horizon: quarter
  track: ops
  type: Task
  priority: Medium
  owner: Routing & scheduling team + account teams
  effort: M · analysis 1 week, then per-employer changes
  issues: [routing_clubbing, pickup_time_changes]
  baseline: {share: 0.0628, k: 13, n: 207, days: 90, as_of: '2026-10-09'}
  evidence: issue
